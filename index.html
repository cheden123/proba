<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Хомяк-Мститель: Рогатка Судьбы</title>
    <meta name="description" content="Платформер в стиле Марио про боевого хомяка с рогаткой: три уровня, враги и кот-босс." />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B9%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="stage">
      <div id="frame">
        <canvas id="game" width="480" height="270"></canvas>
        <div id="overlay" class="overlay"></div>

        <div id="touch" class="touch">
          <div class="touch-side">
            <button class="pad" data-action="left" aria-label="Влево">◀</button>
            <button class="pad" data-action="right" aria-label="Вправо">▶</button>
          </div>
          <div class="touch-side">
            <button class="pad jump" data-action="jump" aria-label="Прыжок">ПРЫЖОК</button>
            <button class="pad shoot" data-action="shoot" aria-label="Выстрел">РОГАТКА</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
